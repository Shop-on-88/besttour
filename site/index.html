<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2463EB">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="베스트여행사">
<title>베스트여행사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 밝은 플랫폼형(A) + 큰 사진 기획전(B). 강조는 블루 한 가지. */
:root{
  color-scheme:light;
  --ink:#111827; --ink2:#374151; --mute:#9CA3AF; --line:#EEF0F4; --line2:#E5E7EB;
  --bg:#FFFFFF; --soft:#F6F8FC; --card:#FFFFFF;
  --blue:#2463EB; --blue-ink:#1D4FD7; --blue-soft:#EEF4FF;
  --navy:#0F172A;
  --ok:#0E9F6E; --warn:#D97706; --bad:#E5484D;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --wrap:1160px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:0}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.03em;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}

/* 헤더 */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.logo{display:flex;align-items:baseline;gap:7px;background:none;border:0;padding:0;flex:0 0 auto;white-space:nowrap}
.logo b{font-weight:800;font-size:23px;letter-spacing:-.04em;white-space:nowrap}
.logo b i{color:var(--blue);font-style:normal}
.logo i{font-family:var(--f-mono);font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--mute);white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:16px}
.nav button{background:none;border:0;padding:8px 13px;border-radius:9px;color:var(--ink2);font-weight:600;font-size:15px}
.nav button:hover,.nav button[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.top .sp{flex:1}
.pbadge{display:flex;align-items:center;gap:7px;background:var(--blue-soft);border:0;color:var(--blue);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.pbadge small{color:#6B7B9A;font-weight:600}
.btn{border:1px solid var(--line2);background:#fff;padding:9px 16px;border-radius:10px;font-weight:700;white-space:nowrap;transition:transform .12s,background .12s,box-shadow .12s}
.btn:hover{background:var(--soft)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-ink)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;border-radius:9px;font-size:13px}
.btn.bad{color:var(--bad);border-color:#F3C7C9;background:#FDECEC}
.btn.block{width:100%;padding:13px}

/* 히어로 + 검색 */
.hero{background:linear-gradient(180deg,#EAF2FF 0%,#F4F8FF 62%,#fff 100%);padding:56px 0 40px;text-align:center}
.hero h1{font-size:clamp(30px,4.6vw,47px);font-weight:800;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lead{margin:0 auto 30px;color:var(--ink2);font-size:17px;max-width:40em}
.sbox{background:#fff;border-radius:22px;box-shadow:0 22px 55px -22px rgba(36,99,235,.4);padding:8px 12px 14px;max-width:910px;margin:0 auto;text-align:left}
.tabs2{display:flex;gap:4px;padding:8px 6px 10px}
.tabs2 span{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs2 .on{background:var(--navy);color:#fff}
.srow{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.srow label{display:flex;flex-direction:column;padding:12px 18px;border-right:1px solid var(--line2);min-width:0}
.srow small{color:var(--mute);font-size:12px;margin-bottom:2px}
.srow input,.srow select{border:0;background:none;outline:none;font-weight:700;font-size:15px;width:100%;min-width:0;padding:0}
.srow select option{font-weight:500}
.srow .btn{border-radius:0;padding:0 34px;font-size:16px}

/* 카테고리 */
.cats{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:34px 0 8px}
.catb{background:none;border:0;text-align:center;font-weight:600;font-size:14px;color:var(--ink2);padding:0}
.catb u{display:block;width:66px;height:66px;border-radius:22px;margin:0 auto 9px;overflow:hidden;box-shadow:0 8px 18px -10px rgba(17,24,39,.4)}
.catb u img{width:100%;height:100%;object-fit:cover}
.catb:hover u{transform:translateY(-2px)}

/* 섹션 공통 */
.blk{padding:40px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sh h2{font-size:clamp(23px,2.6vw,28px);font-weight:800}
.sh p{margin:6px 0 0;color:var(--mute);font-size:14.5px}
.sh .more{background:none;border:0;color:var(--mute);font-size:14px;font-weight:600}
.sh.light h2{color:#fff}.sh.light .eyebrow{color:#BFD4FF}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;color:var(--blue);display:block;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;padding:8px 16px;border-radius:999px;color:var(--ink2);font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* 상품 카드 */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -20px rgba(17,24,39,.35)}
.card .art{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--soft)}
.card .art img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pill.hot{background:var(--bad);color:#fff}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--mute)}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px}
.card .code{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.card h3{font-size:16px;font-weight:700;line-height:1.4}
.card .desc{color:var(--mute);font-size:13px;margin:0}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;margin-top:4px;flex-wrap:wrap}
.price{font-size:19px;font-weight:800;white-space:nowrap}
.price.tbd{font-size:15px;color:var(--mute);font-weight:700}
.cdesc{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#EEF4FF,#DCE8FF);color:var(--navy);text-align:center;padding:12px}
.noph b{font-size:20px;font-weight:800;word-break:keep-all}
.noph i{font-style:normal;font-size:11.5px;color:var(--mute)}
.price small{font-family:var(--f-body);font-size:12px;color:var(--mute);font-weight:500}
.earn{font-size:12px;color:var(--blue);font-weight:700;white-space:nowrap;background:var(--blue-soft);padding:5px 9px;border-radius:8px;margin-left:auto}
.soldout{opacity:.5}

/* B 기획전 */
.feat{background:var(--navy);padding:44px 0 50px;margin:8px 0}
.bigcard{display:block;width:100%;border:0;padding:0;border-radius:22px;overflow:hidden;position:relative;text-align:left;min-height:360px}
.bigcard .bg{position:absolute;inset:0}
.bigcard .bg img{width:100%;height:100%;object-fit:cover}
.bigcard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,15,30,.82) 0%,rgba(10,15,30,.5) 45%,rgba(10,15,30,.05) 100%)}
.bigcard .over{position:relative;z-index:2;color:#fff;padding:44px 48px;max-width:560px}
.bigcard .n{display:inline-block;background:var(--bad);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;letter-spacing:.04em}
.bigcard h3{font-family:var(--f-display);font-size:34px;font-weight:800;margin:14px 0 10px;line-height:1.25}
.bigcard .over p{margin:0 0 20px;color:#D5DCEA;font-size:15px;max-width:34em}
.brow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brow b{font-size:26px;font-weight:800}
.brow b i{font-family:var(--f-body);font-size:13px;font-weight:500;color:#AEB8CC;font-style:normal}
.ern{border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}

/* 혜택 */
.perks{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--soft)}
.perks div{padding:26px 26px 28px;border-right:1px solid var(--line2);background:#fff}
.perks div:last-child{border-right:0}
.perks .k{font-family:var(--f-mono);font-size:32px;font-weight:600;color:var(--blue);line-height:1.1}
.perks h3{font-size:17px;margin:10px 0 6px;font-weight:700}
.perks p{margin:0;color:var(--mute);font-size:14px}

/* 마이페이지 */
.my{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:24px;align-items:start;padding:36px 0}
.panel{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:20px 22px}
.panel h3{font-size:17px;margin-bottom:12px;font-weight:700}
.gauge{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-ink),var(--blue));border-radius:99px}
.stack{display:flex;flex-direction:column;gap:18px}
.wallet{background:linear-gradient(135deg,#1D4FD7,#2463EB);color:#fff;border-radius:var(--r);padding:24px}
.wallet .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:#BFD4FF}
.wallet .v{font-family:var(--f-mono);font-size:40px;font-weight:600;margin:6px 0 16px}
.wallet .gauge{background:rgba(255,255,255,.25)}.wallet .gauge i{background:#fff}
.wallet .sub{font-size:13px;color:#DCE6FF;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:600;color:var(--mute);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--bad);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.pill[style]{position:static!important}

/* 어드민 */
.adm{padding:30px 0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line2);margin:16px 0 22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile span{color:var(--mute);font-size:12.5px}
.tile b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:4px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.row-sel{background:var(--blue-soft)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:12.5px;color:var(--mute)}
.inp{background:#fff;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--blue);outline:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:4px 0 0}
.note{font-size:12.5px;color:var(--mute)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* 모달 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:22px;width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal h2{font-size:22px;margin-bottom:6px;font-weight:800}
.modal .sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.modal .x{float:right;background:none;border:0;font-size:22px;color:var(--mute);line-height:1;padding:4px}
.sum{background:var(--soft);border-radius:14px;padding:14px 16px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--ink2)}
.sum div b{color:var(--ink);font-weight:700}
.sum .tot{border-top:1px dashed var(--line2);margin-top:8px;padding-top:10px;font-size:16px}
.sum .tot b{color:var(--blue);font-size:19px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px)}

.foot{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mute);font-size:13px;margin-top:20px}
.foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.mnav{display:none}

@media (max-width:900px){.logo i{display:none}}
@media (max-width:960px){
  .g4{grid-template-columns:repeat(3,1fr)}
  .cats{grid-template-columns:repeat(4,1fr);row-gap:22px}
}
@media (max-width:760px){
  .nav,.top .hide-m{display:none}
  .g4{grid-template-columns:repeat(2,1fr)}
  .my,.split{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .perks{grid-template-columns:1fr}
  .perks div{border-right:0;border-bottom:1px solid var(--line2)}
  .perks div:last-child{border-bottom:0}
  .bigcard .over{padding:30px 26px;max-width:none}
  .bigcard h3{font-size:26px}
}
@media (max-width:560px){
  body{padding-bottom:68px}
  .wrap{padding:0 18px}
  .top .wrap{gap:7px;height:52px}
  .logo i{display:none}
  .logo b{font-size:19px}
  .nav-explore{display:none}
  .top .btn{padding:7px 11px;font-size:13px}
  .srow{grid-template-columns:1fr 1fr}
  .srow label:first-child{grid-column:1/-1}
  .srow label{border-right:0;border-bottom:1px solid var(--line2)}
  .srow .btn{grid-column:1/-1;padding:13px}
  .cats{grid-template-columns:repeat(4,1fr)}
  .g4{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;width:100%;max-height:92%}
  .mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line2)}
  .mnav button{background:none;border:0;padding:9px 4px 11px;color:var(--mute);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  .mnav button b{font-size:17px;font-weight:400}
  .mnav button[aria-current="page"]{color:var(--blue)}
}

/* 카카오 상단 바 + 플로팅 버튼 (레퍼런스 참고) */
#kkbar{background:#FAE100;color:#191600;display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 42px 5px 14px;font-weight:600;font-size:12.5px;position:relative;text-align:center}
#kkbar .kico{width:17px;height:17px;border-radius:4px;background:#191600;color:#FAE100;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:0 0 auto}
#kkbar .x{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;color:#191600;line-height:1;padding:4px;opacity:.6}
#kkbar.hide{display:none}
#fab{position:fixed;right:18px;bottom:88px;z-index:45;display:flex;flex-direction:column;gap:10px;align-items:center}
#fab button{width:54px;height:54px;border-radius:50%;border:0;box-shadow:0 8px 20px -6px rgba(17,24,39,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11px;gap:1px;cursor:pointer;transition:transform .12s}
#fab button:active{transform:scale(.94)}
#fab .kk{background:#FAE100;color:#191600}
#fab .kk b{font-size:19px;line-height:1}
#fab .up{background:#fff;color:var(--ink2);border:1px solid var(--line2);font-size:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#fab .up.on{opacity:1;pointer-events:auto}
@media (max-width:560px){#fab{right:12px;bottom:80px}#fab button{width:48px;height:48px}}

/* 바로가기 칩줄 + 둘러보기 */
.qbar{border-bottom:1px solid var(--line);background:#fff}
.qrow{display:flex;gap:20px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);width:58px;padding:0}
.qchip u{width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 6px 14px -8px rgba(17,24,39,.5);position:relative}
.qchip u img{width:100%;height:100%;object-fit:cover}
.qchip u.ic{display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:none}
.qchip u.b1{background:var(--blue-soft);color:var(--blue)}
.qchip u.b2{background:#FFF1E6;color:#D97706}
.qchip u.b3{background:#FDECEC;color:var(--bad)}
.qchip:hover u{transform:translateY(-2px)}
.nav-explore{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto;background:none;border:0;font-weight:700;color:var(--ink);padding:8px 10px;border-radius:9px}
.nav-explore:hover{background:var(--soft)}
.nav-explore b{font-weight:400;font-size:11px}
.exlist{display:grid;gap:4px;margin-top:4px}
.exlist button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:14px 14px;font-weight:600;font-size:15.5px}
.exlist button:hover{background:var(--soft)}
.exlist button i{color:var(--mute);font-style:normal}
.exlist button span{color:var(--mute);font-size:19px}

/* 예약 날짜 달력 */

function maxUse(total,bal){var cap=Math.floor(total*RULE.maxRatio);var v=Math.min(bal,cap);return v<RULE.minUse?0:v}
function hashn(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)}
function sod(ms){var d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()}
function dayPrice(p,ms){
  var d=new Date(ms),wd=d.getDay(),f=1;
  if(wd===6)f=1.18;else if(wd===5)f=1.12;else if(wd===0)f=1.06;else if(wd===1||wd===2)f=0.9;else f=0.97;
  var j=(hashn(p.id+"-"+d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate())%9-4)/100;
  return Math.max(10000,Math.round(p.price*(f+j)/1000)*1000);
}
function won10k(v){return Math.round(v/10000)+"만"}
function calMonth(p,y,mo){
  var today=sod(Date.now()),first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate(),lead=first.getDay(),i,mn=Infinity;
  for(i=1;i<=dim;i++){var ms=new Date(y,mo,i).getTime();if(ms>=today){var pr=dayPrice(p,ms);if(pr<mn)mn=pr}}
  var h='<div class="calm"><div class="calh">'+y+"."+("0"+(mo+1)).slice(-2)+'</div><div class="calg">'+
    ["일","월","화","수","목","금","토"].map(function(w,k){return '<span class="cw'+(k===0?" sun":k===6?" sat":"")+'">'+w+'</span>'}).join("");
  for(i=0;i<lead;i++)h+='<span></span>';
  for(i=1;i<=dim;i++){
    var ms=new Date(y,mo,i).getTime(),dow=new Date(ms).getDay(),off=ms<today,pr=dayPrice(p,ms),sel=U.bkDate===ms,lo=pr===mn&&!off;
    h+='<button class="cd'+(off?" off":"")+(sel?" sel":"")+'"'+(off?" disabled":' data-act="bkday" data-ms="'+ms+'"')+'>'+
       '<b class="'+(dow===0?"sun":dow===6?"sat":"")+'">'+i+'</b>'+(off?'':'<i class="'+(lo?"lo":"")+'">'+won10k(pr)+'</i>')+'</button>';
  }
  return h+'</div></div>';
}
function unit(p){return U.bkDate?dayPrice(p,U.bkDate):p.price}
function calcBooking(p,people,use){var total=unit(p)*people,pay=total-use;return {total:total,pay:pay,earn:Math.floor(pay*RULE.rate)}}
function bookingSum(){
  var f=layer.querySelector('[data-form="booking"]');if(!f)return;
  var p=product(f.dataset.id),n=+f.people.value,use=Math.max(0,parseInt(f.use.value.replace(/[^0-9]/g,""),10)||0),c=calcBooking(p,n,use);
  document.getElementById("bk-sum").innerHTML='<div>상품 금액 <b class="num">'+won(p.price)+'원 × '+n+'명</b></div><div>포인트 사용 <b class="num">-'+won(use)+'P</b></div><div>예약 확정 시 적립 <b class="num" style="color:var(--ok)">+'+won(Math.max(0,c.earn))+'P</b></div><div class="tot">결제 금액 <b class="num">'+won(Math.max(0,c.pay))+'원</b></div>';
}

function err(id,msg){var e=document.getElementById(id);if(e)e.textContent=msg;return false}
function int(v){var s=String(v).replace(/,/g,"").trim();return /^-?\d+$/.test(s)?parseInt(s,10):NaN}
function go(v){U.view=v;try{if(location.hash!=="#"+v)location.hash=v}catch(e){}render();window.scrollTo(0,0)}
function scrollToId(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"})}
function cancelBooking(id){
  var b=S.bookings.find(function(x){return x.id===id});if(!b||b.status!=="confirmed")return "이미 처리된 예약입니다.";
  var net=b.used-b.earned;
  if(balance(b.memberId)+net<0)return "적립 포인트를 이미 사용해 회수할 잔액이 부족합니다. 관리자에게 문의하세요.";
  b.status="cancelled";b.cancelledAt=Date.now();
  if(b.used>0)addLedger(b.memberId,"refund",b.used,"예약 취소로 사용 포인트 복원",{bookingId:b.id});
  if(b.earned>0)addLedger(b.memberId,"revoke",-b.earned,"예약 취소로 적립 포인트 회수",{bookingId:b.id});
  var p=product(b.productId);if(p)p.seats+=b.people;
  return "";
}

  "do-booking-cancel":function(d){var b=S.bookings.find(function(x){return x.id===d.id}),x=b&&member(b.memberId),msg=cancelBooking(d.id);if(msg)return err("c-err",msg);if(me().role==="admin"&&x)audit(x.name+" 회원 예약 취소 처리, 사용 "+won(b.used)+"P 복원, 적립 "+won(b.earned)+"P 회수");save();closeModal();toast("예약을 취소했습니다");render()},
  "do-ledger-del":function(d){var i=S.ledger.findIndex(function(x){return x.id===d.id}),l=S.ledger[i],x=member(l.memberId),bal=balance(l.memberId);if(bal-l.amount<0)return err("c-err","이 내역을 지우면 잔액이 0보다 작아집니다. 현재 잔액은 "+won(bal)+"P입니다.");S.ledger.splice(i,1);audit(x.name+" 회원 포인트 내역 삭제: 「"+l.reason+"」 "+(l.amount>0?"+":"")+won(l.amount)+"P, 잔액 "+won(bal)+"P → "+won(bal-l.amount)+"P");save();closeModal();toast("내역을 삭제했습니다");render()},
  "do-member-del":function(d){var x=member(d.id);S.members=S.members.filter(function(m){return m.id!==d.id});S.ledger=S.ledger.filter(function(l){return l.memberId!==d.id});audit(x.name+" 회원 삭제 ("+x.email+")");U.sel=null;save();closeModal();toast("회원을 삭제했습니다");render()},
  "do-product-del":function(d){var p=product(d.id);S.products=S.products.filter(function(x){return x.id!==d.id});audit("상품 삭제: "+p.name);save();closeModal();toast("상품을 삭제했습니다");render()},
  "do-reset":function(){S=seed();S.session="m0";U.sel=null;save();closeModal();toast("처음 상태로 되돌렸습니다");render()}
};
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.dataset.act;
  if(a==="ov"){if(e.target===t)closeModal();return}
  if(acts[a]){e.preventDefault();acts[a](t.dataset)}
});
document.addEventListener("submit",function(e){var f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();forms[f.dataset.form](f)});
document.addEventListener("input",function(e){if(e.target.closest('[data-form="booking"]'))bookingSum()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
window.addEventListener("hashchange",route);
function route(){var h=(location.hash||"").replace("#","");U.view=["home","mypage","admin"].indexOf(h)>-1?h:"home";render()}
function render(){
  gid=0;
  document.getElementById("app").innerHTML=header()+'<main>'+({home:home,mypage:mypage,admin:admin}[U.view]||home)()+'</main>'+footer();
}
// 플로팅 버튼 / 상단 바
(function(){
  var up=document.querySelector('#fab .up');
  window.addEventListener('scroll',function(){if(up){up.classList.toggle('on',window.scrollY>400)}},{passive:true});
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-fab]');if(!b)return;
    if(b.dataset.fab==='top')window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
    else toast('카카오톡 상담 채널이 연결됩니다 (샘플)');
  });
})();
route();
})();
</script>
